name: Platform CI

# Typecheck + tests for the GameDay Platform backend (platform/).
# Runs on pushes/PRs that touch the platform or this workflow.

on:
  push:
    branches: [main, 'platform-**']
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'

defaults:
  run:
    working-directory: platform

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck

  test:
    name: Tests (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # CI-only throwaway credentials for the ephemeral test container.
          # These are NOT production secrets.
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      # Point the platform at the CI Postgres service container.
      DATABASE_URL: postgres://platform:platform@localhost:5432/platform_test
      DIRECT_URL: postgres://platform:platform@localhost:5432/platform_test
      # Supabase + Loop values are not exercised by unit tests; provide
      # syntactically-valid placeholders so config validation passes.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      CACHE_ENABLED: 'false'
      LOOP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci || npm install
      - name: Apply migrations
        run: npm run db:migrate
      - name: Seed database
        run: npm run db:seed
      - name: Run tests
        run: npm test
